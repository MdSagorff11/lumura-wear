<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lomura Wear | Login & Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');

* { padding: 0; margin: 0; box-sizing: border-box; font-family: "Hind Siliguri", sans-serif; }

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f1ec;
    overflow: hidden;
}

.bg-circle {
    position: fixed; border-radius: 50%; background: #f4f1ec;
    box-shadow: 15px 15px 30px rgba(189, 175, 156, .4), -15px -15px 30px rgba(255, 255, 255, .95);
    z-index: -5; animation: floating 6s ease-in-out infinite;
}
.bg1 { width: 190px; height: 190px; top: 7%; left: 7%; }
.bg2 { width: 130px; height: 130px; right: 8%; bottom: 8%; animation-delay: 1.5s; }
.bg3 { width: 55px; height: 55px; right: 20%; top: 22%; animation-delay: 3s; }
@keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }

.auth-wrapper { width: 400px; max-width: 92%; perspective: 1600px; z-index: 10; }
.auth-card {
    position: relative; width: 100%; min-height: 620px;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.68, -0.55, .27, 1.55);
}

/* ✅ FIX: iOS 3D Flip Bug */
.auth-card.flipped { transform: rotateY(180deg); }
.auth-card.flipped .login-panel { pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.auth-card:not(.flipped) .signup-panel { pointer-events: none; opacity: 0; transition: opacity 0.3s; }

.form-panel {
    position: absolute; inset: 0; padding: 40px 32px; border-radius: 35px;
    background: #f4f1ec;
    box-shadow: 20px 20px 40px rgba(189, 175, 156, .5), -20px -20px 40px rgba(255, 255, 255, .95);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}
.login-panel { transform: rotateY(0deg) translateZ(1px); }
.signup-panel { transform: rotateY(180deg) translateZ(1px); }

.logo {
    width: 80px; height: 80px; margin: 0 auto 20px;
    display: flex; justify-content: center; align-items: center;
    border-radius: 50%; font-size: 30px; color: #b8894b;
    background: #f4f1ec;
    box-shadow: 9px 9px 18px rgba(189, 175, 156, .5), -9px -9px 18px rgba(255, 255, 255, .95);
    transition: 0.4s ease;
}
.logo:hover { transform: translateY(-5px) rotate(8deg); }

h1 { text-align: center; font-size: 26px; color: #3d3d3d; margin-bottom: 5px; }
.subtitle { text-align: center; color: #7c766f; font-size: 13px; margin-bottom: 28px; }

.input-group { position: relative; width: 100%; height: 58px; margin-bottom: 19px; z-index: 1; }

.electric-border {
    position: absolute; inset: -2px; border-radius: 19px; overflow: hidden;
    pointer-events: none; opacity: 0; transition: opacity .2s ease; z-index: -1;
}
.electric-border::before {
    content: ""; position: absolute; width: 170%; height: 170%; left: -35%; top: -35%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 30deg, #b8894b 45deg, #96703a 65deg, #b8894b 80deg, transparent 105deg, transparent 360deg);
    animation: electricRotate 1.1s linear infinite;
}
.electric-border::after {
    content: ""; position: absolute; inset: 2px; border-radius: 17px; background: #f4f1ec;
}
.electric-glow {
    position: absolute; inset: -4px; border-radius: 21px;
    pointer-events: none; opacity: 0; filter: blur(7px); z-index: -1;
    background: conic-gradient(from 0deg, transparent, #b8894b, transparent);
}
.input-group:focus-within .electric-border { opacity: 1; }
.input-group:focus-within .electric-glow { opacity: .55; animation: electricRotate 1.1s linear infinite; }
@keyframes electricRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.input-group input {
    position: absolute; inset: 2px; width: calc(100% - 4px); height: 54px;
    border: none; outline: none; border-radius: 16px; background: #f4f1ec; color: #3d3d3d;
    font-size: 15px; padding: 0 45px 0 18px; z-index: 10;
    box-shadow: inset 6px 6px 12px rgba(189, 175, 156, .4), inset -6px -6px 12px rgba(255, 255, 255, .95);
    transition: box-shadow .25s ease;
    transform: translateZ(2px);
    -webkit-appearance: none;
}
.input-group input:focus {
    box-shadow: inset 3px 3px 7px rgba(189, 175, 156, .4), inset -3px -3px 7px rgba(255, 255, 255, .95);
}

.input-group label {
    position: absolute; left: 18px; top: 18px; z-index: 20; color: #9a948c;
    font-size: 15px; pointer-events: none; transition: all .25s ease;
}
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
    top: -8px; left: 13px; padding: 2px 8px; border-radius: 7px;
    color: #b8894b; background: #f4f1ec; font-size: 10px; line-height: 14px; white-space: nowrap;
}

.password-toggle {
    position: absolute; right: 14px; top: 15px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: #9a948c; cursor: pointer; z-index: 30; font-size: 16px;
}
.password-toggle:hover { color: #b8894b; transform: scale(1.1); }

.options { display: flex; justify-content: space-between; align-items: center; margin: 5px 3px 22px; color: #7c766f; font-size: 13px; }
.checkbox { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.checkbox input { accent-color: #b8894b; }
.options a { color: #b8894b; text-decoration: none; font-weight: 600; }

.main-btn {
    position: relative; isolation: isolate; width: 100%; height: 55px;
    border: none; border-radius: 17px; background: #f4f1ec; color: #b8894b;
    font-size: 15px; font-weight: 700; letter-spacing: .4px; cursor: pointer; overflow: hidden;
    box-shadow: 8px 8px 16px rgba(189, 175, 156, .5), -8px -8px 16px rgba(255, 255, 255, .95);
    transition: .3s ease; z-index: 10;
}
.main-btn::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient( 110deg, #b8894b, #d4a52c, #b8894b);
    background-size: 200% 100%; transform: translateY(100%); transition: transform .35s ease; z-index: -1;
}
.main-btn:hover::before { transform: translateY(0); animation: buttonMove 1.5s linear infinite; }
@keyframes buttonMove { from { background-position: 0 50%; } to { background-position: 200% 50%; } }
.main-btn:hover { color: #fff; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(184, 137, 75, .35); }
.main-btn:active { transform: scale(.97); }
.main-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.switch-area { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 24px; font-size: 13px; color: #7c766f; }
.switch-circle {
    width: 46px; height: 46px; border: none; border-radius: 50%; background: #f4f1ec; color: #b8894b;
    font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center;
    box-shadow: 7px 7px 14px rgba(189, 175, 156, .5), -7px -7px 14px rgba(255, 255, 255, .95);
    transition: .35s ease;
}
.switch-circle:hover { color: #fff; background: #b8894b; transform: rotate(180deg) scale(1.08); box-shadow: 0 8px 25px rgba(184, 137, 75, .35); }
.switch-circle:active { transform: scale(.9); }

.toast {
    position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100px);
    background: #3d3d3d; color: #fff; padding: 12px 24px; border-radius: 999px;
    font-size: 14px; font-weight: 500; z-index: 1000; opacity: 0; transition: all .4s;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: 90vw; text-align: center;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.success { background: #22a558; }
.toast.error { background: #e83c3c; }

@media (max-width: 400px) {
    .form-panel { padding: 30px 20px; }
    .auth-card { min-height: 600px; }
}
</style>
</head>
<body>

    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">

            <!-- ================= LOGIN FORM ================= -->
            <div class="form-panel login-panel">
                <div class="logo"><i class="fa-solid fa-lock"></i></div>
                <h1>স্বাগতম</h1>
                <p class="subtitle">কেনাকাটা শুরু করতে লগইন করুন</p>

                <form id="loginForm">
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="tel" id="loginPhone" placeholder=" " autocomplete="tel" required maxlength="11">
                        <label for="loginPhone">মোবাইল নম্বর</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="loginPassword" placeholder=" " autocomplete="current-password" required>
                        <label for="loginPassword">পাসওয়ার্ড</label>
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox"> মনে রাখুন
                        </label>
                        <a href="https://wa.me/8801605700879?text=আসসালামু আলাইকুম,%20আমি%20আমার%20Lomura%20Wear%20এর%20পাসওয়ার্ড%20ভুলে%20গেছি।" target="_blank">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>
                    
                    <button type="submit" class="main-btn" id="loginBtn">লগইন করুন</button>
                </form>

                <div class="switch-area">
                    <span>নতুন গ্রাহক?</span>
                    <button type="button" class="switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- ================= SIGN UP FORM ================= -->
            <div class="form-panel signup-panel">
                <div class="logo"><i class="fa-solid fa-user-plus"></i></div>
                <h1>অ্যাকাউন্ট তৈরি করুন</h1>
                <p class="subtitle">আমাদের সাথে আপনার যাত্রা শুরু করুন</p>

                <form id="signupForm">
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="text" id="signupName" placeholder=" " autocomplete="name" required>
                        <label for="signupName">আপনার নাম</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="tel" id="signupPhone" placeholder=" " autocomplete="tel" required maxlength="11">
                        <label for="signupPhone">মোবাইল নম্বর</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="signupPassword" placeholder=" " autocomplete="new-password" required>
                        <label for="signupPassword">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                        <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password" required>
                        <label for="confirmPassword">পাসওয়ার্ড আবার লিখুন</label>
                    </div>

                    <button type="submit" class="main-btn" id="signupBtn">অ্যাকাউন্ট তৈরি করুন</button>
                </form>

                <div class="switch-area">
                    <span>আগে থেকেই অ্যাকাউন্ট আছে?</span>
                    <button type="button" class="switch-circle" onclick="flipCard()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ========== FIREBASE CONFIG ==========
        var firebaseConfig = {
          apiKey: "AIzaSyBbp1RN4uBkkb-eWBp67tUdfnlT7Uma-B8",
          authDomain: "lomura-wear-f5157.firebaseapp.com",
          projectId: "lomura-wear-f5157",
          storageBucket: "lomura-wear-f5157.firebasestorage.app",
          messagingSenderId: "464988753874",
          appId: "1:464988753874:web:ad6348f8a097d8ea64c20b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ========== UI HELPERS ==========
        function flipCard() {
            document.getElementById("authCard").classList.toggle("flipped");
        }

        function togglePassword(id, button) {
            const input = document.getElementById(id);
            const icon = button.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        let toastTimer;
        function toast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.className = 'toast', 3000);
        }

        // পাসওয়ার্ড হ্যাশ করার ছোট ফাংশন (নিরাপত্তার জন্য)
        function hashPassword(pw){
          var hash = 0;
          for(var i = 0; i < pw.length; i++){
            var char = pw.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
          }
          return 'h' + Math.abs(hash).toString(36) + '_' + pw.length;
        }

        // ========== SIGN UP LOGIC ==========
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const pass = document.getElementById('signupPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            
            if(!name || !phone || !pass) { toast('❌ সব ঘর পূরণ করুন', 'error'); return; }
            if(phone.length !== 11 || phone[0] !== '0') { toast('❌ সঠিক ১১ ডিজিটের নম্বর দিন', 'error'); return; }
            if(pass.length < 6) { toast('❌ পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে', 'error'); return; }
            if(pass !== confirmPass) { toast('❌ পাসওয়ার্ড দুটো মিলছে না', 'error'); return; }

            const btn = document.getElementById('signupBtn');
            btn.textContent = '⏳ অপেক্ষা করুন...';
            btn.disabled = true;

            // চেক করা হচ্ছে নাম্বার আগে থেকে আছে কিনা
            db.collection('users').doc(phone).get().then(function(doc) {
                if (doc.exists) {
                    toast('❌ এই নম্বর দিয়ে আগেই অ্যাকাউন্ট করা হয়েছে! লগইন করুন।', 'error');
                    btn.textContent = 'অ্যাকাউন্ট তৈরি করুন';
                    btn.disabled = false;
                    return;
                }
                
                // নতুন ইউজার সেভ করা হচ্ছে
                db.collection('users').doc(phone).set({
                    name: name,
                    phone: phone,
                    password: hashPassword(pass),
                    verified: true,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(function() {
                    localStorage.setItem('lomura_user', JSON.stringify({ name: name, phone: phone, verified: true }));
                    toast('✅ অ্যাকাউন্ট তৈরি সফল!', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                }).catch(function(error) {
                    toast('❌ সমস্যা: ' + error.message, 'error');
                    btn.textContent = 'অ্যাকাউন্ট তৈরি করুন';
                    btn.disabled = false;
                });
            });
        });

        // ========== LOGIN LOGIC ==========
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPassword').value;
            
            if(!phone || !pass) { toast('❌ সব ঘর পূরণ করুন', 'error'); return; }
            if(phone.length !== 11 || phone[0] !== '0') { toast('❌ সঠিক ১১ ডিজিটের নম্বর দিন', 'error'); return; }

            const btn = document.getElementById('loginBtn');
            btn.textContent = '⏳ অপেক্ষা করুন...';
            btn.disabled = true;

            // ডেটাবেজ থেকে ইউজার খোঁজা হচ্ছে
            db.collection('users').doc(phone).get().then(function(doc) {
                if (!doc.exists) {
                    toast('❌ এই নম্বরে অ্যাকাউন্ট নেই। সাইন আপ করুন।', 'error');
                    btn.textContent = 'লগইন করুন';
                    btn.disabled = false;
                    return;
                }
                
                const data = doc.data();
                // পাসওয়ার্ড মিলছে কিনা চেক
                if (data.password !== hashPassword(pass)) {
                    toast('❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।', 'error');
                    btn.textContent = 'লগইন করুন';
                    btn.disabled = false;
                    return;
                }
                
                // লগইন সফল
                localStorage.setItem('lomura_user', JSON.stringify({ name: data.name, phone: data.phone, verified: true }));
                toast('✅ লগইন সফল!', 'success');
                setTimeout(() => window.location.href = 'index.html', 1500);
                
            }).catch(function(error) {
                toast('❌ সমস্যা: ' + error.message, 'error');
                btn.textContent = 'লগইন করুন';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
